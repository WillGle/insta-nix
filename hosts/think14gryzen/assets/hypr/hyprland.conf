# General
$mod = MOD4

source = __THEME_GENERATED_DIR__/hyprland-decoration.conf

# Source the saved touchpad lock: reloads discard runtime keywords.
source = __TOUCHPAD_STATE_CONF__

input {
  touchpad {
    natural_scroll = false
    tap-to-click = true
    # Keep motion enabled while typing; libinput otherwise suppresses only motion.
    disable_while_typing = false
  }
}

# Gestures
gesture = 3, horizontal, workspace

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

debug {
  disable_logs = false
}

animations {
  enabled = true
}

xwayland {
  force_zero_scaling = true
}

# Environment
env = WLR_FRACTIONAL_SCALE,1
env = XCURSOR_THEME,__CURSOR_NAME__
env = XCURSOR_SIZE,__CURSOR_SIZE__

# Let portals and apps detect the Wayland session.
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = NIXOS_OZONE_WL,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_IM_MODULE,fcitx

monitor = eDP-1, 3072x1920@60, 0x0, 1.5

# Import the environment before starting session services.
exec-once = sh -c 'systemctl --user import-environment --all && dbus-update-activation-environment --systemd --all && systemctl --user start hyprland-session.target'
exec-shutdown = systemctl --user stop hyprland-session.target

exec-once = sh -c 'command -v xrdb >/dev/null 2>&1 && xrdb -merge ~/.Xresources'
exec-once = sh -c '~/.config/hypr/toggle_touchpad.sh --reset || true'

# Window rules
# Float pairing prompts so they remain visible and do not time out.
# Match both NixOS-wrapped and bare window classes.
windowrule = match:class ^(\.?blueman-.*)$, float on
windowrule = match:class ^(\.?blueman-.*)$, center on

windowrule = match:class ^(.*[Oo]verskride.*)$, float on
windowrule = match:class ^(.*[Oo]verskride.*)$, center on
windowrule = match:class ^(.*[Oo]verskride.*)$, size 1100 750

# Keep authentication prompts visible.
windowrule = match:class ^(lxqt-policykit-agent)$, float on
windowrule = match:class ^(lxqt-policykit-agent)$, center on

# Keybindings
bind = $mod, Return, exec, foot
bind = $mod, D, exec, ~/.local/bin/rofi-show drun
bind = $mod, Equal, exec, ~/.local/bin/rofi-show calc -modi calc -no-show-match -no-sort -calc-command "echo -n '{result}' | wl-copy"
bind = $mod, period, exec, ~/.local/bin/rofi-show emoji -modi emoji
bind = $mod, N, exec, ~/.local/bin/rofi-network
bind = ALT, Tab, exec, ~/.local/bin/rofi-show window
bind = $mod, W, exec, ~/.config/hypr/toggle_waybar.sh
# Use `wallpaper pick` or `wallpaper set`; the Wallpaper portal uses the same owner.
bind = $mod, P, exec, ~/.local/bin/monitor-setup
bind = $mod, Q, killactive
bind = $mod, F, togglefloating
bind = $mod SHIFT, E, exit
bind = $mod, L, exec, ~/.local/bin/theme-lock
bind = $mod, Escape, exec, rofi -show power-menu -modi power-menu:rofi-power-menu -config ~/.config/rofi/config.rasi -theme ~/.config/rofi/power.rasi
bind = $mod, E, exec, foot yazi

# Screen rotation
# Cycle 0→90→270 for the focused / under-cursor monitor
bind = $mod ALT, R, exec, ~/.config/hypr/rotate_select.sh

# Reset the focused monitor to 0°.
bind = $mod ALT, X, exec, ~/.config/hypr/rotate_select.sh --set 0

# Cycle all monitors.
bind = $mod ALT SHIFT, R, exec, ~/.config/hypr/rotate_select.sh --all

# Set all monitors to 90°.
bind = $mod ALT CTRL, R, exec, ~/.config/hypr/rotate_select.sh --all --set 1

# Clipboard
bind = $mod, V, exec, ~/.local/bin/rofi-clipboard

# Focus movement
bind = $mod, H, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Touchpad
# Retained for external keyboards; this hardware does not emit KEY_TOUCHPAD_TOGGLE.
bind = , XF86TouchpadToggle, exec, ~/.config/hypr/toggle_touchpad.sh
# Keep plain F8 available to applications.
bind = $mod, F8, exec, ~/.config/hypr/toggle_touchpad.sh

# Audio and brightness
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

# Mouse
bindm = $mod, mouse:272, movewindow     # Left-click to drag window
bindm = $mod, mouse:273, resizewindow   # Right-click to resize window

# Screenshots

# Super + S: Fullscreen screenshot -> ~/Pictures + clipboard
bind = $mod, S, exec, ~/.local/bin/screenshot full

# Super + Shift + S: Region select screenshot -> ~/Pictures + clipboard
bind = $mod SHIFT, S, exec, ~/.local/bin/screenshot region

# Super + C: Region select screenshot, clipboard only
bind = $mod, C, exec, ~/.local/bin/screenshot clip

# Screen recording

# Super + R: Toggle fullscreen recording -> ~/Videos
bind = $mod, R, exec, ~/.local/bin/screen-rec toggle

# Super + Shift + R: Toggle region recording -> ~/Videos
bind = $mod SHIFT, R, exec, ~/.local/bin/screen-rec region
