# ── General ──────────────────────────────────────────────────────
$mod = MOD4

source = __THEME_GENERATED_DIR__/hyprland-decoration.conf

# Touchpad lock state, written by toggle_touchpad.sh. Sourced rather than left
# to `hyprctl keyword` because `hyprctl reload` — which theme-apply issues on
# every wallpaper change — drops runtime keywords and would silently unlock.
source = /home/will/.local/state/hypr/touchpad.conf

input {
  touchpad {
    natural_scroll = false
    tap-to-click = true
    # Hyprland defaults this to true. libinput then suppresses motion but not
    # the physical buttons, which reads exactly like a half-broken touchpad.
    disable_while_typing = false
  }
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

debug {
  disable_logs = false
}

animations {
  enabled = true
}

xwayland {
  force_zero_scaling = true
}

# ── Environment ──────────────────────────────────────────────────
env = WLR_FRACTIONAL_SCALE,1
env = XCURSOR_THEME,__CURSOR_NAME__
env = XCURSOR_SIZE,__CURSOR_SIZE__

# Set Wayland/DE session vars so portals & apps detect the environment
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = NIXOS_OZONE_WL,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORM,wayland;xcb

# Input Method environment variables
env = XMODIFIERS,@im=fcitx
env = QT_IM_MODULE,fcitx

# Set exact mode/scale for laptop panel
monitor = eDP-1, 3072x1920@60, 0x0, 1.5

# Import the session environment before starting its systemd target
exec-once = sh -c 'systemctl --user import-environment --all && dbus-update-activation-environment --systemd --all && systemctl --user start hyprland-session.target'
exec-shutdown = systemctl --user stop hyprland-session.target

# Merge any Xresources (for terminal font settings etc.)
exec-once = sh -c 'command -v xrdb >/dev/null 2>&1 && xrdb -merge ~/.Xresources'
exec-once = ~/.config/hypr/autostart.conf

# ── Keybindings ──────────────────────────────────────────────────
# --- Basic ---
bind = $mod, Return, exec, foot
bind = $mod, D, exec, ~/.local/bin/rofi-show drun
bind = $mod, Equal, exec, ~/.local/bin/rofi-show calc -modi calc -no-show-match -no-sort -calc-command "echo -n '{result}' | wl-copy"
bind = $mod, period, exec, ~/.local/bin/rofi-show emoji -modi emoji
bind = $mod, N, exec, ~/.local/bin/rofi-network
bind = ALT, Tab, exec, ~/.local/bin/rofi-show window
bind = $mod, W, exec, ~/.config/hypr/toggle_waybar.sh
bind = $mod SHIFT, W, exec, ~/.local/bin/wallpaper pick
bind = $mod, P, exec, ~/.local/bin/monitor-setup
bind = $mod, Q, killactive
bind = $mod, F, togglefloating
bind = $mod SHIFT, E, exit
bind = $mod, L, exec, ~/.local/bin/theme-lock
bind = $mod, Escape, exec, rofi -show power-menu -modi power-menu:rofi-power-menu -config ~/.config/rofi/config.rasi
bind = $mod, E, exec, foot yazi

# --- Screen Rotate ---
# Cycle 0→90→270 for the focused / under-cursor monitor
bind = $mod ALT, R, exec, ~/.config/hypr/rotate_select.sh

# (optional) Force 0° for the focused monitor
bind = $mod ALT, X, exec, ~/.config/hypr/rotate_select.sh --set 0

# (optional) Cycle rotate all monitors
bind = $mod ALT SHIFT, R, exec, ~/.config/hypr/rotate_select.sh --all

# (optional) Force 90° for all monitors
bind = $mod ALT CTRL, R, exec, ~/.config/hypr/rotate_select.sh --all --set 1

# --- Clipboard ---
bind = $mod, V, exec, ~/.local/bin/rofi-clipboard

# --- Focus movement ---
bind = $mod, H, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# --- Workspace ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# --- Touchpad ---
# Neither the built-in nor the MCHOSE keyboard declares KEY_TOUCHPAD_TOGGLE
# (0x21b), so on this machine the binding below never fires. It is kept for
# external keyboards that do emit it.
bind = , XF86TouchpadToggle, exec, ~/.config/hypr/toggle_touchpad.sh
# Working binding on this hardware. Uses $mod so plain F8 stays available to
# applications, unlike the previous bare `, F8` bind.
bind = $mod, F8, exec, ~/.config/hypr/toggle_touchpad.sh

# --- Audio & Brightness ---
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

# --- Mouse ---
bindm = $mod, mouse:272, movewindow     # Left-click to drag window
bindm = $mod, mouse:273, resizewindow   # Right-click to resize window

# ── Screenshot ───────────────────────────────────────────────────

# Super + S: Fullscreen screenshot, save to ~/Pictures
bind = $mod, S, exec, grim ~/Pictures/screenshot-$(date +%s).png

# Super + Shift + S: Region select screenshot, save to ~/Pictures
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" ~/Pictures/selection-$(date +%s).png

# Super + C: Region select screenshot, copy to clipboard
bind = $mod, C, exec, grim -g "$(slurp)" - | wl-copy
